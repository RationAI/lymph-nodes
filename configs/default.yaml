defaults:
  - _self_
  - hydra: default
  - logger: mlflow
  - /model/backbone: ???
  
seed: ${random_seed:}
mode: ???
task: ???
kind: ???
checkpoint: null

trainer:
  enable_checkpointing: True
  max_epochs: 100
  log_every_n_steps: 5
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 3
      monitor: validation/loss
      mode: min
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: validation/loss
      mode: min
      patience: 10
    # - _target_: lymph_nodes.callbacks.ModelUnfreeze
    #   patience: 5
    # # Predict callbacks
    - _target_: lymph_nodes.callbacks.AvgTileMaskBuilder



data:
  batch_size: 32
  epoch_size: 500
  positive_batch_split: 0.5
  num_workers: 8

metadata:
  experiment_name: Lymph Nodes
  run_name: "DAB ${mode} ${model_name: ${model.backbone._target_}} | Task: ${task}"
  description: >
    Running a ${mode} mode deep learning model on the Lymph Nodes DAB dataset.
    This experiment is configured for the ${task} task and the ${model_name:model.backbone._target_} architecture.
  hyperparams: {}
