defaults:
  - hydra: default
  - logger: mlflow
  - /data/datasets@data.train: lymph_nodes/train
  # - /data/datasets@data.test: lymph_nodes/test
  # - /data/datasets@data.predict: lymph_nodes/predict
  - /model/backbone: ???
  - _self_

seed: ${random_seed:}
mode: ???
checkpoint: null

trainer:
  enable_checkpointing: True
  max_epochs: 30
  log_every_n_steps: 5
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 1
      monitor: validation/loss
      mode: min

data:
  batch_size: 256
  epoch_size: 2000
  num_workers: 8

metadata:
  experiment_name: Lymph Nodes
  run_name: Lymph Nodes DAB training
  description: Training a model on the Lymph Nodes DAB dataset
  hyperparams: {}
