defaults:
  - hydra: default
  - logger: mlflow
  - /data/datasets@data.train: lymph_nodes/train
  - /data/datasets@data.val: lymph_nodes/val
  - /data/datasets@data.test: lymph_nodes/test
  - /data/datasets@data.predict: lymph_nodes/predict
  - /model/backbone: ???
  - _self_

seed: ${random_seed:}
mode: ???
checkpoint: null

trainer:
  enable_checkpointing: True
  max_epochs: 100
  log_every_n_steps: 5
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 3
      monitor: validation/loss
      mode: min
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: validation/loss
      mode: min
      patience: 5

data:
  batch_size: 160
  epoch_size: 3000
  positive_batch_split: 0.5
  num_workers: 8

metadata:
  experiment_name: Lymph Nodes
  run_name: Lymph Nodes DAB training 0.5
  description: Training a model on the Lymph Nodes DAB dataset with 0.5 split and 3000 epoch size
  hyperparams: {}
