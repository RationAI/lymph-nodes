defaults:
  - data: mnist     # Points to configs/mil/data/mnist.yaml
  - model: attention  # Points to configs/mil/model/attention.yaml
  - _self_    # Allows overwriting params in this file

experiment_name: "mil_mnist_test"

training:
  epochs: 10
  lr: 0.0001
  weight_decay: 1e-5
  device: "cuda"  # or "cpu"