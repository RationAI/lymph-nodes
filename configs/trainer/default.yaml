max_epochs: 50
accelerator: auto
devices: auto
precision: "16-mixed"
log_every_n_steps: 50

# Monitoring AUROC rather than accuracy/loss: robust to the ~20:1 class imbalance and
# doesn't depend on picking a decision threshold.
callbacks:
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/auroc
    mode: max
    save_top_k: 1
    # Explicit names instead of auto-inserted "name=value": the metric's "/" would make a
    # subdirectory, and the checkpoint is referenced by its MLflow URI for testing.
    # No dot in the name: the MLFlowLogger matches its uploaded checkpoints to the
    # trainer's by Path(...).stem, which cuts "auroc0.9805" to "auroc0" — no match, so
    # every epoch it re-uploaded the kept checkpoints and deleted them as stale, leaving
    # only the newest (or, with one kept, none every other epoch).
    filename: "epoch{epoch:02d}"
    auto_insert_metric_name: false
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/auroc
    mode: max
    patience: 5
  # Only active in the final evaluations (validate / test), not during fit.
  prediction_masks:
    _target_: lymph_nodes.callbacks.PredictionMasks
  # Lesion-level detection (lymph_nodes/callbacks/lesion_metrics.py), final
  # evaluations only. Lymph node cohorts only: TMA slides have no tumour status.
  lesion_metrics:
    _target_: lymph_nodes.callbacks.LesionMetrics
    cohorts: [mmci_ihc_2023, mmci_ihc_test]
  # Slide-level detection (lymph_nodes/callbacks/slide_metrics.py), final evaluations
  # only: every lymph node slide with its status, the unannotated positive ones too.
  slide_metrics:
    _target_: lymph_nodes.callbacks.SlideMetrics
    cohorts: [mmci_ihc_2023, mmci_ihc_test, fnb_ae]
