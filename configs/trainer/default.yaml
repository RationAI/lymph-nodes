max_epochs: 50
accelerator: auto
devices: auto
precision: "16-mixed"
log_every_n_steps: 50

# Monitoring AUROC rather than accuracy/loss: robust to the ~20:1 class imbalance and
# doesn't depend on picking a decision threshold.
callbacks:
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: validation/auroc
    mode: max
    save_top_k: 1
    # Explicit names instead of auto-inserted "name=value": the metric's "/" would make a
    # subdirectory, and the checkpoint is referenced by its MLflow URI for testing.
    filename: "epoch{epoch:02d}-auroc{validation/auroc:.4f}"
    auto_insert_metric_name: false
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: validation/auroc
    mode: max
    patience: 5
  # Only active in the final evaluations (validate / test), not during fit.
  prediction_masks:
    _target_: lymph_nodes.callbacks.PredictionMasks
