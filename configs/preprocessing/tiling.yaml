# @package _global_

mpp: 0.5
tile_extent: 224
stride: ???
rows_per_shard: 250_000

rois:
  tissue:
    _target_: shapely.geometry.box
    _args_:
      - ${scale:${tile_extent},0.25}
      - ${scale:${tile_extent},0.25}
      - ${scale:${tile_extent},0.75}
      - ${scale:${tile_extent},0.75}

  full:
    _target_: shapely.geometry.box
    _args_:
      - 0
      - 0
      - ${tile_extent}
      - ${tile_extent}

memory_per_gpu_worker: ???
batch_size: ???
embedding_model: ???

datasets: ???

# Set on ray.data.DataContext before tiling. Without a terminal, Ray Data logs one line
# per operator every progress_bar_log_interval seconds (~12 lines / 5 s for this
# pipeline); keep only the dataset-level line, once a minute. Override e.g.
# ray_data_context.enable_operator_progress_bars=true to see per-operator state.
ray_data_context:
  enable_operator_progress_bars: false
  progress_bar_log_interval: 60


metadata:
  run_name: Tiling ${dataset_name}
  description: Tile extraction and embedding for ${dataset_name}
  hyperparams:
    mpp: ${mpp}
    tile_extent: ${tile_extent}
    stride: ${stride}
    rows_per_shard: ${rows_per_shard}
    name: ${dataset_name}
    embedding_model: ${embedding_model}
