# @package _global_

mpp: 0.5
tile_extent: 224
stride: ???
# The stride of the evaluation splits (val, test) of the data configs that use it: the
# same as the others' unless an experiment sets it (mmci_hdab_segmentation.yaml).
eval_stride: ${stride}
# Lymph node masks (preprocessing/node_masks.py, one run per cohort): set by the
# cohort's data config (configs/data/tiling); null: node_coverage / node_grid are null.
node_mask_dir: null
rows_per_shard: 250_000

rois:
  tissue:
    _target_: shapely.geometry.box
    _args_:
      - ${scale:${tile_extent},0.25}
      - ${scale:${tile_extent},0.25}
      - ${scale:${tile_extent},0.75}
      - ${scale:${tile_extent},0.75}

  full:
    _target_: shapely.geometry.box
    _args_:
      - 0
      - 0
      - ${tile_extent}
      - ${tile_extent}

memory_per_gpu_worker: ???
batch_size: ???
embedding_model: ???
# Display names for run names (the class names' "Encoder" suffix adds nothing there).
embedding_model_names:
  GigaPathEncoder: GigaPath
  UNI2Encoder: UNI2
  Virchow2Encoder: Virchow2

datasets: ???

ray_cpus_per_core: 4

ray_data_context:
  enable_operator_progress_bars: false
  progress_bar_log_interval: 60


metadata:
  run_name: "🧩 Tiling · ${dataset_name} · ${embedding_model_names.${embedding_model}}"
  description: Tile extraction and embedding for ${dataset_name}
  hyperparams:
    mpp: ${mpp}
    tile_extent: ${tile_extent}
    stride: ${stride}
    rows_per_shard: ${rows_per_shard}
    name: ${dataset_name}
    embedding_model: ${embedding_model}
