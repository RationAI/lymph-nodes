# @package _global_

defaults:
  - base
  - _self_


slide_paths: ???

mpp: 0.25
tile_extent: 512
stride: 256

output_dir: /
artifact_path: tiles

with_annotations: false
with_tissue_mask: true
with_blur_mask: true

num_cpus_tiles: 1
memory_tiles: 4294967296  # 4GB in bytes

std_threshold: 8.0
min_tissue_coverage: 0.5
max_blur_coverage: 0.3

metadata:
  run_name: Tiling ${dataset.name}
  description: Tile extraction for ${dataset.name} at ${mpp} mpp with quality filtering
