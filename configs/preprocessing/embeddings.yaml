# @package _global_

output_dir: ${project_dir}/embeddings/${dataset.name}/${tile_encoder.name}

dataloader:
  batch_size: 2048
  num_workers: 8
  persistent_workers: True

metadata:
  run_name: '📂 Embeddings: Lymph Nodes - ${dataset.name} - ${tile_encoder.name}'
  description: 'Embeddings preprocessing experiment for lymph nodes dataset (institution: ${dataset.institution}) using ${tile_encoder.name} tile encoder.'
  hyperparams:
    tile_encoder: ${tile_encoder.name}
    dataset_name: ${dataset.name}
    dataset_institution: ${dataset.institution}
    batch_size: ${dataloader.batch_size}
    num_workers: ${dataloader.num_workers}
    