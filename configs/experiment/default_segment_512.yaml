defaults:
  - _self_
  - /data/datasets@data.train: segmentation_512/train
  - /data/datasets@data.val: segmentation_512/val
  - /data/datasets@data.test: segmentation_512/test
  - /data/datasets@data.predict: segmentation_512/predict

trainer:
  callbacks:
    mask_builder:
      _target_: lymph_nodes.callbacks.TileMaskBuilder
      artifact_path: segmentation_masks
      tile_builder_cstr:
        _target_: rationai.masks.mask_builders.TileMaskBuilder
        _partial_: True
    max_mask_builder:
      _target_: lymph_nodes.callbacks.TileMaskBuilder
      artifact_path: max_segmentation_masks
      tile_builder_cstr:
        _target_: lymph_nodes.callbacks.builders.MaxMaskBuilder
        _partial_: True
    centric_mask_builder:
      _target_: lymph_nodes.callbacks.TileMaskBuilder
      artifact_path: centric_segmentation_masks
      tile_builder_cstr:
        _target_: lymph_nodes.callbacks.builders.CentricMaskBuilder
        _partial_: True
        tile_extent_x: 512
        tile_extent_y: 512

metadata:
  run_name: "🏋️‍♂️ ${model_name: ${model.model._target_}} 512 pre w/ Head"
  description: "Running segmentatation model ${model_name: ${model.model._target_}} on the Lymph Nodes DAB dataset."

data:
  batch_size: 32 # Auto adjusted
  infer_batch_size: 64
  epoch_size: 2000

model:
  _target_: lymph_nodes.segmentation_model.SegmentationModel
  criterion:
    _target_: lymph_nodes.modeling.SetCriterion
    losses:
      - _target_: lymph_nodes.modeling.CriterionLoss
        name: "dice"
        weight: 1
        kind: masks
        loss:
          _target_: lymph_nodes.modeling.losses.DiceLoss
      - _target_: lymph_nodes.modeling.CriterionLoss
        name: "focal"
        weight: 20
        kind: masks
        loss:
          _target_: lymph_nodes.modeling.losses.FocalLoss
      # - _target_: lymph_nodes.modeling.CriterionLoss
      #   name: "tversky"
      #   weight: 0.1
      #   kind: masks
      #   loss:
      #     _target_: lymph_nodes.modeling.losses.TverskyLoss
      - _target_: lymph_nodes.modeling.CriterionLoss
        name: "bce"
        weight: 1
        kind: labels
        loss:
          _target_: torch.nn.BCELoss
  warmup_epochs: 1
