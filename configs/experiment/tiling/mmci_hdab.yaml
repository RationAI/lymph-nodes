# @package _global_

stride: 122

tissue_mask_dir: mlflow-artifacts://mlflow.rationai-mlflow:5000/68/10bfc155a303465882aada4928487822/artifacts/tissue_masks
annotation_mask_dir: mlflow-artifacts://mlflow.rationai-mlflow:5000/68/10bfc155a303465882aada4928487822/artifacts/annotation_masks
blur_mask_dir: mlflow-artifacts://mlflow.rationai-mlflow:5000/68/fadfd18d81e74cb6849a3e93f8bfdef3/artifacts/blur_per_pixel
brownish_mask_dir: mlflow-artifacts://mlflow.rationai-mlflow:5000/68/10bfc155a303465882aada4928487822/artifacts/color_separation_masks

# Each key becomes a column in the output Parquet.
# Processors run in config order.
tiling_blocks:
  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: tissue_coverage
    uri: ${tissue_mask_dir}
    roi: ${rois.tissue}
    min_label: 1 # keep everything that is not background (label 0)
    mandatory: true

  # drop tiles with < 10% tissue coverage
  - _target_: preprocessing.tiling_blocks.Operator
    operator: filter
    expr: "tissue_coverage >= 0.1"

  - _target_: preprocessing.tiling_blocks.Operator
    operator: repartition
    target_num_rows_per_block: 512

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: blur_coverage
    uri: ${blur_mask_dir}
    roi: ${rois.full}
    min_label: 127
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: annotation_coverage
    uri: ${annotation_mask_dir}
    roi: ${rois.full}
    min_label: 255
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: brownish_coverage
    uri: ${brownish_mask_dir}
    roi: ${rois.full}
    min_label: 127
    mandatory: false

  - _target_: preprocessing.tiling_blocks.ReadTiles
    name: tile

  - _target_: preprocessing.tiling_blocks.BrownishCoverage
    name: brownish_coverage_new
    image_col: tile
    dab_threshold: 0.15

  - _target_: preprocessing.tiling_blocks.FoundationModelEmbedding
    name: embedding
    image_col: tile
    encoder:
      _target_: preprocessing.models.${embedding_model}
    batch_size: ${batch_size}
    concurrency: 1
    memory_per_worker: ${memory_per_gpu_worker}

  - _target_: preprocessing.tiling_blocks.Operator
    operator: drop_columns
    cols: ["level", "tile", "path", "mpp_x", "mpp_y", "tile_extent_x", "tile_extent_y"]
