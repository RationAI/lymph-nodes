# @package _global_

# Lymph node (H-DAB) tiling for segmentation (lymph_nodes/ segmentation scenarios):
# the scalar coverages of mmci_hdab.yaml (filters, labels, sampler partitions), plus
# per-patch coverage grids (OverlayGrid, 16 x 16 = the 14 px patch tokens of the
# foundation models at 224 px). No overlap in the folds — dense outputs don't need it
# for training — and half-tile overlap in the evaluation splits (eval_stride); no
# embeddings: training reads the tiles and runs the frozen foundation model itself.
# CPU only.

stride: ${tile_extent}
# The evaluation splits (val, test: data configs with stride ${eval_stride}) at half the
# tile: every point in the central half of one tile, whose patches the prediction masks
# keep (PredictionMasks). 112 px = 8 patches of 14 px (16 of 7 at grid 32), so the
# overlapping tiles' patches coincide. The folds, for training and the validation
# during fit, stay at a full tile.
eval_stride: 112
grid: 16  # tile_extent / patch size of the foundation models (14 px)

tissue_mask_dir: mlflow-artifacts://mlflow.rationai-mlflow:5000/68/10bfc155a303465882aada4928487822/artifacts/tissue_masks
annotation_mask_dir: mlflow-artifacts://mlflow.rationai-mlflow:5000/68/10bfc155a303465882aada4928487822/artifacts/annotation_masks
blur_mask_dir: mlflow-artifacts://mlflow.rationai-mlflow:5000/68/fadfd18d81e74cb6849a3e93f8bfdef3/artifacts/blur_per_pixel
# The annotations narrowed to stained cells (preprocessing/refined_annotation_masks.py,
# scripts/preprocessing/refined_annotation_masks.py), for the refined evaluation labels
# (configs/lymph_nodes.yaml, ln_refined_labels): MLflow run 28e00226 (2026-11-03, no
# margin around the stained cells; 1cae2de7 before, grown by 2 um).
refined_annotation_mask_dir: mlflow-artifacts:/4/28e00226ea774c4da853a48abfb6cfcc/artifacts/refined_annotation_masks
# Lymph node masks: node_mask_dir, per cohort in its data config (configs/data/tiling),
# null by default (configs/preprocessing/tiling.yaml): node_coverage / node_grid null.

embedding_model: null
memory_per_gpu_worker: null
batch_size: null

tiling_blocks:
  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: tissue_coverage
    uri: ${tissue_mask_dir}
    roi: ${rois.tissue}
    min_label: 1 # keep everything that is not background (label 0)
    mandatory: true

  # drop tiles with < 10% tissue coverage
  - _target_: preprocessing.tiling_blocks.Operator
    operator: filter
    expr: "tissue_coverage >= 0.1"

  - _target_: preprocessing.tiling_blocks.Operator
    operator: repartition
    target_num_rows_per_block: 512

  - _target_: preprocessing.tiling_blocks.OverlayGrid
    name: tissue_grid
    uri: ${tissue_mask_dir}
    roi: ${rois.full}
    grid: ${grid}
    min_label: 1
    mandatory: true

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: blur_coverage
    uri: ${blur_mask_dir}
    roi: ${rois.full}
    min_label: 127
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: annotation_coverage
    uri: ${annotation_mask_dir}
    roi: ${rois.full}
    min_label: 255
    mandatory: false

  # The share of the tile inside the lymph node (null without node masks); used only
  # where a config asks for it, e.g. filters.in_node (configs/lymph_nodes.yaml).
  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: node_coverage
    uri: ${node_mask_dir}
    roi: ${rois.full}
    min_label: 128
    mandatory: false

  - _target_: preprocessing.tiling_blocks.ReadTiles
    name: tile

  # brownish_coverage: the share of the tile in DAB-stained cells by colour
  # deconvolution (preprocessing/staining.py), the cells of the refined labels; the
  # name is the one the training configs read.
  - _target_: preprocessing.tiling_blocks.DabCoverage
    name: brownish_coverage
    image_col: tile

  # After DabCoverage: its numpy batches can't carry a grid column mixing values
  # and nulls (slides with and without an annotation mask) back into Arrow.
  - _target_: preprocessing.tiling_blocks.OverlayGrid
    name: annotation_grid
    uri: ${annotation_mask_dir}
    roi: ${rois.full}
    grid: ${grid}
    min_label: 255
    mandatory: false

  # Refined labels: the masks hold each ~1 um pixel's covered fraction (* 255).
  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: annotation_brown_coverage
    uri: ${refined_annotation_mask_dir}
    roi: ${rois.full}
    min_label: 128
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayGrid
    name: annotation_brown_grid
    uri: ${refined_annotation_mask_dir}
    roi: ${rois.full}
    grid: ${grid}
    min_label: 128
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayGrid
    name: node_grid
    uri: ${node_mask_dir}
    roi: ${rois.full}
    grid: ${grid}
    min_label: 128
    mandatory: false

  - _target_: preprocessing.tiling_blocks.Operator
    operator: drop_columns
    cols: ["level", "tile", "path", "mpp_x", "mpp_y", "tile_extent_x", "tile_extent_y"]

metadata:
  run_name: "🧩 Segmentation tiling · ${dataset_name}"
  description: Tile extraction with per-patch coverage grids (no embeddings) for ${dataset_name}
