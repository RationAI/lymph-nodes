# @package _global_

tissue_mask_dir: ???
ignore_mask_dir: null
cytokeratin_mask_dir: null
cyto_ignore_mask_dir: null
annotation_mask_dir: null
blur_mask_dir: null



tissue_roi:
  _target_: shapely.geometry.box
  _args_:
    - ${scale:${tile_extent},0.25}
    - ${scale:${tile_extent},0.25}
    - ${scale:${tile_extent},0.75}
    - ${scale:${tile_extent},0.75}

full_roi:
  _target_: shapely.geometry.box
  _args_:
    - 0
    - 0
    - ${tile_extent}
    - ${tile_extent}

# Each key becomes a column in the output Parquet.
# Processors run in config order.
tiling_blocks:
  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: tissue_coverage
    uri: ${tissue_mask_dir}
    roi: ${tissue_roi}
    min_label: 1 # keep everything that is not background (label 0)
    mandatory: true
    
  # drop tiles with < 10% tissue coverage
  - _target_: preprocessing.tiling_blocks.Operator
    operator: filter
    expr: "tissue_coverage >= 0.1"

  - _target_: preprocessing.tiling_blocks.Operator
    operator: repartition
    target_num_rows_per_block: 512

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: ignore_coverage
    uri: ${ignore_mask_dir}
    roi: ${full_roi}
    min_label: 255
    mandatory: false

  - _target_: preprocessing.tiling_blocks.Operator
    operator: filter
    expr: "ignore_coverage == 0 or is_null(ignore_coverage)"
  #     # _target_: operator.eq
  #     # _args_:
  #     #   - _target_: ray.data.expressions.col
  #     #     _args_: [ignore_coverage]
  #     #   - 0

  - _target_: preprocessing.tiling_blocks.Operator
    operator: repartition
    target_num_rows_per_block: 512

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: cyto_ignore_coverage
    uri: ${cyto_ignore_mask_dir}
    roi: ${full_roi}
    min_label: 255
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: blur_coverage
    uri: ${blur_mask_dir}
    roi: ${full_roi}
    min_label: 127
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: annotation_coverage
    uri: ${annotation_mask_dir}
    roi: ${full_roi}
    min_label: 255
    mandatory: false

  - _target_: preprocessing.tiling_blocks.OverlayCoverage
    name: cytokeratin_coverage
    uri: ${cytokeratin_mask_dir}
    roi: ${full_roi}
    min_label: 255
    mandatory: false

  - _target_: preprocessing.tiling_blocks.ReadTiles
    name: tile
    
  - _target_: preprocessing.tiling_blocks.BrownishCoverage
    name: brownish_coverage
    image_col: tile
    dab_threshold: 0.15

  - _target_: preprocessing.tiling_blocks.FoundationModelEmbedding
    name: embedding
    image_col: tile
    encoder:
      _target_: preprocessing.models.${embedding_model}
    batch_size: ${batch_size}
    concurrency: 1
    memory_per_worker: ${memory_per_gpu_worker}

  - _target_: preprocessing.tiling_blocks.Operator
    operator: drop_columns
    cols: ["level", "tile", "path", "mpp_x", "mpp_y", "tile_extent_x", "tile_extent_y"]
