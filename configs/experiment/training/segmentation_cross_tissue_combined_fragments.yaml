# @package _global_

# segmentation_cross_tissue_combined.yaml with larger pasted groups (CellPasting's
# fragment_p): a fifth of the pastes are a fragment of the TMA donor's stained
# epithelium, 30-80 um long (at most 0.6 of the tile) and up to 3x narrower, cut
# along the stained tissue — nests, cords and branching strands of tens of cells. The
# rest as before: small groups 30%, 1-3 single cells 50%.
#
# Why: the combined models flagged only the edges and loose cells of strongly stained
# clusters of tens of cells in lymph nodes (IHC 2023 val), though they find TMA tumour
# sheets: in lymph node tissue their only positives were pasted cells and groups of up
# to ~40 um, while brown structures of negative lymph nodes (the brownish share, the
# hard-negative bank) are taught as negative. Still no positive lymph node in training.
defaults:
  - /experiment/training/segmentation_cross_tissue_combined
  - _self_

scenario: cross-tissue segmentation combined fragments

data:
  train:
    cell_pasting:
      fragment_p: 0.2
      fragment_um: [30.0, 80.0]
