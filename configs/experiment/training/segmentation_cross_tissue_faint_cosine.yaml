# @package _global_

# segmentation_cross_tissue_faint.yaml with a cosine learning rate (200 steps of
# warm-up, down to 1% at the last step) and an exponential moving average of the head's
# weights (decay 0.999: ~1,000 steps, ~1.3 epochs of 781) evaluating: the constant rate
# left the lymph node results swinging between epochs (D collapsed at epoch 11, H's
# tile AUROC fell from 0.95 to 0.89 between epochs 4 and 5).
defaults:
  - /experiment/training/segmentation_cross_tissue_faint
  - _self_

scenario: cross-tissue segmentation faint cosine

model:
  lr_schedule: cosine
  warmup_steps: 200
  min_lr_ratio: 0.01
  ema_decay: 0.999
