# @package _global_

# segmentation_cross_tissue_combined.yaml with more of the out-of-focus look: half the
# training tiles blurred (instead of a fifth), by up to 3 px (1.5 um) instead of 1.5,
# and half of those only on one side of a soft straight edge (TileAugmentation's
# blur_partial_p: a seam between scanner fields focused at different depths).
#
# Why: on IHC 2023 val the combined models missed strongly stained clusters lying in a
# field ~0.4-0.6 um softer than its neighbours (measured against a sharp band of the
# same field across a focus seam), while flagging those in the sharp band. Blur of
# that size was in the training already, on a fifth of the tiles and always over the
# whole tile.
defaults:
  - /experiment/training/segmentation_cross_tissue_combined
  - _self_

scenario: cross-tissue segmentation combined focus

data:
  train:
    augmentation:
      blur_p: 0.5
      blur_sigma: [0.5, 3.0]
      blur_partial_p: 0.5
