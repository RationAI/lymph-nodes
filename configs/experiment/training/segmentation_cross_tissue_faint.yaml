# @package _global_

# segmentation_cross_tissue_retiled.yaml with faint staining (TileAugmentation's
# dab_fade_p): a third of the training tiles get their DAB faded to the level of the
# faint isolated tumour cells the models miss (median DAB 0.03-0.05 of the stained
# pixels; the faintest third of the annotated groups reads ~0.031, the TMA breast
# tumour cells ~0.08).
defaults:
  - /experiment/training/segmentation_cross_tissue_retiled
  - _self_

scenario: cross-tissue segmentation faint

data:
  train:
    augmentation:
      dab_fade_p: 0.3
      dab_fade_to: [0.03, 0.05]
      min_fade: 0.25
