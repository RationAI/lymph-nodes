# @package _global_

# segmentation_cross_tissue_hard_negatives.yaml (H) on the re-tiling of 2026-11-04 (the
# tiling runs of segmentation_cross_tissue_upsampled.yaml), without the cell pasting:
# the control of the experiments built on it (segmentation_cross_tissue_faint*.yaml).
# What changed against H, besides the pasting: the TMA cores' corrected ground truth
# with its ignore label left out of the loss; the core split; the refined labels
# without margin; the evaluation splits at stride 112, scored by the tiles' centres
# (model.tile_region); and the brownish rule.
#
# brownish_threshold: brownish_coverage is now the deconvolution DAB detector's, whose
# values run higher than the old colour rule's: at 0.002 it would file 11.6% of the
# training folds' lymph node tiles as brownish (3.6x the old rule's 3.2%); 0.03 keeps
# the old share, the brownest 3.2% (folds 1-4, tissue > 0.2).
defaults:
  - /experiment/training/segmentation_cross_tissue_hard_negatives
  - _self_

scenario: cross-tissue segmentation retiled

brownish_threshold: 0.03

# No positive lymph node slide anywhere in the training job — neither its training nor
# its validation during fit: lymph node annotations are for the evaluations only
# (data.eval, data.test). The validation during fit is fold k's negative lymph node
# slides and TMA cores:
# - 8 of fold k's lymph node slides whole (ln_validation_subset, data.val's run 0), not
#   a tenth of their tiles: LesionMetrics (during_fit) reports their false positive
#   tiles and regions per negative slide each epoch — what a model flags in tissue
#   without tumour;
# - fold k's TMA cores, the patch metrics.
# Every epoch's checkpoint is kept; none of these measures whether isolated tumour
# cells are found (the TMA patches are near-perfect throughout), so the epoch is
# chosen afterwards — by default the last, which the cosine schedule and the moving
# average of the head (segmentation_cross_tissue_combined.yaml) make the steadiest.
ln_validation_subset:
  _target_: lymph_nodes.data.datasets.meta_dataset.RandomSubset
  fraction: 1.0
  slides: 8
  source: 0

data:
  train:
    cell_pasting: null
  val:
    tile_filters:
      - ${filters.tissue}
      - ${filters.no_patho_ignore}
      - ${filters.no_cytokeratin_ignore}
      - ${tma_ambiguous_band}
      - ${ln_validation_subset}

trainer:
  callbacks:
    lesion_metrics:
      during_fit: true
