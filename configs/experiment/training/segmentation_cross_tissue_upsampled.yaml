# @package _global_

# segmentation_cross_tissue_itc.yaml at twice the output resolution: logits on a 32 x 32
# grid per 224 px tile (7 px, ~3.4 um cells) instead of one per 14 px patch
# (lymph_nodes.modeling.UpsamplingHead), trained against 32 x 32 target grids: the
# segmentation tilings re-run with grid=32. A tumour cell of ~10 um straddles several
# 14 px patches, each seeing only part of it; the finer cells let one be centred on it.
# 8 epochs: the ITC run did best at epochs 5-8 and worse after.
defaults:
  - /experiment/training/segmentation_cross_tissue_itc
  - _self_

scenario: cross-tissue segmentation upsampled

# The tilings with 32 x 32 grids (scripts/preprocessing/segmentation_tiling.py): the
# re-tiling of 2026-11-04 — refined labels without margin, node coverage, the
# deconvolution DAB coverage; lymph node folds at stride 224, their val and test splits
# at 112; the TMAs by core split with the corrected ground truth, every split at 112.
# FN Brno has no grids (all-zero targets), so its tiling serves as is. U, U+B and H
# were fitted on the earlier tilings (bdb7965d, f7afe860, 59782132; their MLflow
# configs), so evaluations on these are not comparable with theirs.
ihc_run_uri: mlflow-artifacts:/4/6e5cfb22dc81414a9c8042ff9f494f00/artifacts
ihc_test_run_uri: mlflow-artifacts:/4/c57beae2f0ba4b34ae676734756f3634/artifacts
tma_run_uri: mlflow-artifacts:/4/552e866b7e9d4b65b3b42b1d65a3a4f4/artifacts

model:
  decode_head:
    _target_: lymph_nodes.modeling.UpsamplingHead
    scale: 2
    image_channels: 0

data:
  train:
    grid: 32
  val:
    grid: 32
  eval:
    grid: 32
  test:
    grid: 32

trainer:
  max_epochs: 8
