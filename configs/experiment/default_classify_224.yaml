defaults:
  - _self_
  - /data/datasets@data.train: classification/train
  - /data/datasets@data.val: classification/val
  - /data/datasets@data.test: classification/test
  - /data/datasets@data.predict: classification/predict

metadata:
  run_name: "🏋️‍♂️ ${model_name: ${model.model._target_}}"
  description: "Running classification model ${model_name: ${model.model._target_}} on the Lymph Nodes DAB dataset."

trainer:
  max_epochs: 10
  callbacks:
    cls_mask_builder:
      _target_: lymph_nodes.callbacks.ClsMaskBuilder
      artifact_path: classifcation_heatmaps

data:
  batch_size: 32 # auto adjusted
  infer_batch_size: 64
  epoch_size: 500
  num_workers: 12

model:
  _target_: lymph_nodes.classification_model.ClassificationModel
  warmup_epochs: 0
