# Segmentation on the patch tokens of a frozen foundation model: a linear probe of
# every patch token (1x1 convolution) over the last n_layers blocks (see
# FrozenFoundationModel and SegmentationMetaArch). ${embedding_model} and
# ${patch_token_dim} come from the data config (configs/data/segmentation/).
_target_: lymph_nodes.segmentation_meta_arch.SegmentationMetaArch

backbone:
  _target_: lymph_nodes.modeling.FrozenFoundationModel
  name: ${embedding_model}
  n_layers: 4  # the last n blocks' patch tokens
  layers: null  # or the blocks themselves, 0-based, e.g. [7, 15, 23, 31] (Virchow2: 32)

decode_head:
  _target_: torch.nn.Conv2d
  in_channels: ${token_channels:${model.backbone.n_layers},${model.backbone.layers},${patch_token_dim}}
  out_channels: 1
  kernel_size: 1

lr: 1.0e-4
weight_decay: 0.05
lr_schedule: constant  # or cosine: warmup_steps of linear warm-up, then down to min_lr_ratio x lr
warmup_steps: 0
min_lr_ratio: 0.0
ema_decay: null  # e.g. 0.999: a moving average of the head's weights evaluates
tile_score: max  # a tile scores its most confident patch
tile_region: centre  # where tiles overlap, only their centre patches score (else: full)

# Weighted focal + soft Dice per patch (lymph_nodes.modeling.DiceFocalLoss). The
# segmentation runs before it (up to 2026-10-14) trained with plain BCE, which
# `criterion: {_target_: torch.nn.BCEWithLogitsLoss}` reproduces.
criterion:
  _target_: lymph_nodes.modeling.DiceFocalLoss
  focal_weight: 1.0
  dice_weight: 1.0
  gamma: 2.0
  tile_weight: 0.0  # the tile term: each tile's top-k logits against its label
  tile_topk: 8
  asl_weight: 0.0  # the asymmetric loss, an alternative to the focal term
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05  # negatives below this probability cost nothing
  rank_weight: 0.0  # tiles ranked: positives above the batch's hardest negatives
  rank_margin: 1.0  # in logits
  rank_negatives: 32
