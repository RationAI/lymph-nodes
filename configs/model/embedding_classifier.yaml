# No backbone to train — the embedding (1536-dim, GigaPath) was already computed by
# the preprocessing pipeline. decode_head is the actual trainable classifier.
backbone:
  _target_: torch.nn.Identity

decode_head:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: torch.nn.Linear
      in_features: 1536
      out_features: 256
    - _target_: torch.nn.ReLU
    - _target_: torch.nn.Dropout
      p: 0.2
    - _target_: torch.nn.Linear
      in_features: 256
      out_features: 1

lr: 1.0e-3
