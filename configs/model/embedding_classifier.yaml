# No backbone to train — the embedding was already computed by the preprocessing
# pipeline (its size comes from the data config). decode_head is the trainable classifier.
backbone:
  _target_: torch.nn.Identity

decode_head:
  _target_: torch.nn.Sequential
  _args_:
    - _target_: torch.nn.Linear
      in_features: ${embedding_dim}
      out_features: 256
    - _target_: torch.nn.ReLU
    - _target_: torch.nn.Dropout
      p: 0.2
    - _target_: torch.nn.Linear
      in_features: 256
      out_features: 1

lr: 1.0e-3
