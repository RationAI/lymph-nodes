# @package _global_

defaults:
  - hydra: default
  - logger: mlflow
  - /data/datasets@data.train: tile_patch/tile_patch
  - /data/embeddings/uris
  - _self_

seed: 42
mode: fit
checkpoint: null
foundation: ???
level: ???

source_tracking_uri: null

embeddings_uri: ${uris.patch_embeddings.${key:${foundation}}.${level}}

trainer:
  enable_checkpointing: true
  max_epochs: 50
  log_every_n_steps: 10
  callbacks:
    - _target_: lightning.pytorch.callbacks.TQDMProgressBar
      refresh_rate: 1
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 1
      monitor: val/AUC
      mode: max
    - _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: val/AUC
      mode: max
      patience: 10
    - _target_: postprocessing.heatmap.ValHeatmapCallback
      dest: val_heatmaps
      tile_extent: ${tile_extent}
      batch_size: ${data.batch_size}
      num_workers: ${data.num_workers}

data:
  batch_size: 512
  num_workers: 8
  kfold_splits: 5
  k: null
  pos_weight: 0.5 
  sampler_num_samples: 500000

model:
  _target_: lymph_nodes.patch_mlp.PatchMLP
  foundation: ${foundation}
  hidden_dims: [512, 256]
  dropout: 0.25
  lr: 0.0001
  loss: bce          # "bce" or "focal"
  pos_weight: 1.0    # used when loss=bce — multiplies loss on positive tiles
  focal_alpha: 0.25  # used when loss=focal — weight for positive class (0-1)
  focal_gamma: 2.0   # used when loss=focal — focusing strength (0=BCE, 2=standard focal)

metadata:
  experiment_name: 'Lymph Nodes'
  run_name: '🏋️‍♂️ Patch MLP: ${foundation} ${level} (fold ${data.k}/${data.kfold_splits})'
  description: 'Patch-based MLP for lymph node metastasis detection'
  hyperparams:
    foundation: ${foundation}
    level: ${level}
