# @package _global_

defaults:
  - base
  - model: embedding_classifier
  - trainer: default
  - _self_

seed: 42
mode: ???
checkpoint: null
fold: ???
scenario: ???
# TMA tiles with cytokeratin coverage above this are cancer, in training (set by the
# scenario, configs/experiment/training/) and in the TMA part of data.eval.
cytokeratin_positive_threshold: ???

filters:
  tissue:
    _target_: lymph_nodes.data.datasets.meta_dataset.FilterCondition
    column: tissue_coverage
    op: ">"
    value: 0.2
  no_patho_ignore:
    _target_: lymph_nodes.data.datasets.meta_dataset.FilterCondition
    column: patho_ignore_coverage
    op: ">"
    value: 0
    negate: true
  no_cytokeratin_ignore:
    _target_: lymph_nodes.data.datasets.meta_dataset.FilterCondition
    column: cytokeratin_ignore_coverage
    op: ">"
    value: 0
    negate: true
  negative_slides:
    _target_: lymph_nodes.data.datasets.meta_dataset.FilterCondition
    column: tumor
    op: "=="
    value: false
  # Slides with an on-slide TMA control: carcinoma tissue as a staining control, so on
  # a negative slide real cancer that any good model flags. The split keeps them out of
  # training; evaluation leaves them out too. Slides without the column (TMAs) stay.
  no_tma_control:
    _target_: lymph_nodes.data.datasets.meta_dataset.FilterCondition
    column: has_tma_control
    op: "=="
    value: true
    negate: true
  # SNB_IHC_CASE_66_SLIDE_6-0 has a control but was listed as 68 6-0 (a slide that
  # doesn't exist) in configs/data/raw/mmci_ihc_2023.yaml; the slides tables of the
  # tiling runs keep has_tma_control false for it until the patient dataset, split and
  # tilings are re-run from the corrected list.
  no_unflagged_tma_control:
    _target_: lymph_nodes.data.datasets.meta_dataset.FilterCondition
    column: slide_name
    op: in
    value: [SNB_IHC_CASE_66_SLIDE_6-0]
    negate: true
  # blur:
  #   _target_: lymph_nodes.data.datasets.meta_dataset.FilterCondition
  #   column: blur_coverage
  #   op: "<"
  #   value: 0.3

# Lymph node labels for evaluation, in two sets; label_set picks the one the metrics
# use (configs/data/segmentation/runs.yaml picks refined: the segmentation tilings carry
# it, the classification ones only have the outlines).
#   outline - the pathologists' annotations. A tile touching one is positive, but one
#             with at most a quarter of it annotated is borderline (often a tiny focus
#             in lymphoid tissue): still evaluated, and the metrics are also reported
#             without the borderline tiles (<cohort>/unambiguous/, see MetaArch).
#   refined - the annotations narrowed to stained cells, a stained region overlapping
#             an outline kept whole a little beyond it
#             (preprocessing/refined_annotation_masks.py), so the lymphoid tissue the
#             rough outlines take in no longer counts. The negatives of positive slides
#             are ambiguous instead: the pathologist may have left an ITC unannotated,
#             so the unambiguous metrics take their negatives from negative slides only.
# With refined labels the outline ones are reported too (<cohort>/outline/,
# patch/outline/), via data.eval/test outline_labels.
label_set: outline
ln_label_sets:
  outline:
    _target_: lymph_nodes.data.datasets.embedding.TileLabels
    positive:
      annotation_coverage: 0.0
    ambiguous:
      annotation_coverage: [0.0, 0.25]
  refined:
    _target_: lymph_nodes.data.datasets.embedding.TileLabels
    positive:
      annotation_brown_coverage: 0.0
    ambiguous_on_positive_slides: true

# data.eval labels: the lymph node ones plus cytokeratin for the TMAs. Each column
# exists for one tissue only (NaN for the other), and NaN is never positive. TMA tiles
# with cytokeratin coverage between 0.1 and the positive threshold are borderline, the
# band the TMA epithelium baseline drops in training.
eval_label_sets:
  outline:
    _target_: lymph_nodes.data.datasets.embedding.TileLabels
    positive:
      annotation_coverage: 0.0
      cytokeratin_coverage: ${cytokeratin_positive_threshold}
    ambiguous:
      annotation_coverage: ${ln_label_sets.outline.ambiguous.annotation_coverage}
      cytokeratin_coverage: [0.1, "${cytokeratin_positive_threshold}"]
  refined:
    _target_: lymph_nodes.data.datasets.embedding.TileLabels
    positive:
      annotation_brown_coverage: 0.0
      cytokeratin_coverage: ${cytokeratin_positive_threshold}
    ambiguous:
      cytokeratin_coverage: [0.1, "${cytokeratin_positive_threshold}"]
    ambiguous_on_positive_slides: true

ln_labels: ${ln_label_sets.${label_set}}
eval_labels: ${eval_label_sets.${label_set}}

data:
  batch_size: 2048
  num_workers: 6

  # Evaluation is the same for every scenario: does the model find real lymph node
  # metastases? Positive slides without an annotation mask are evaluated, but their
  # tiles are left out of the tile metrics (meta `ignore`) — their metastases aren't
  # outlined, so all their tiles would count as healthy; they count in the slide
  # metrics (lymph_nodes.callbacks.SlideMetrics) and get prediction masks. Slides with
  # a TMA control are left out (filters.no_tma_control).
  # The TMA validation set is evaluated too: does the model still tell cytokeratin-
  # positive from cytokeratin-negative TMA tissue? Every TMA tile is kept, the ones
  # with coverage between 0 and the threshold included (labelled negative), to see the
  # predictions at the boundary as well. The ignore filters only concern the TMAs
  # (`negate` keeps the lymph nodes' NaN); per-cohort metrics keep the cohorts apart.
  eval:
    _target_: lymph_nodes.data.datasets.embedding.EmbeddingClassificationDataset
    uris:
      - ${ihc_run_uri}/val
      - ${ihc_test_run_uri}/val
      - ${tma_run_uri}/val
    labels: ${eval_labels}
    tile_filters:
      - ${filters.tissue}
      - ${filters.no_patho_ignore}
      - ${filters.no_cytokeratin_ignore}
    slide_filters:
      - ${filters.no_tma_control}
      - ${filters.no_unflagged_tma_control}
    ignore_unannotated_positive_slides: true

  test:
    _target_: lymph_nodes.data.datasets.embedding.EmbeddingClassificationDataset
    uris:
      - ${ihc_run_uri}/test
    labels: ${ln_labels}
    tile_filters:
      - ${filters.tissue}
    slide_filters:
      - ${filters.no_tma_control}
      - ${filters.no_unflagged_tma_control}
    ignore_unannotated_positive_slides: true

mode_emojis:
  fit: 🏋️
  validate: ✅
  test: 🧪
  predict: 🔮

metadata:
  run_name: "${mode_emojis.${mode}} ${scenario} · ${embedding_model} · fold ${fold}"
  description: >-
    Cancer-vs-healthy tile classification on precomputed ${embedding_model} tile
    embeddings, scenario "${scenario}" (configs/experiment/training/), fold ${fold}
    of 5-fold cross-validation held out for validation. Mode: ${mode}.
  hyperparams:
    seed: ${seed}
    mode: ${mode}
    scenario: ${scenario}
    checkpoint: ${checkpoint}
    batch_size: ${data.batch_size}
    fold: ${fold}
    embedding_model: ${embedding_model}
