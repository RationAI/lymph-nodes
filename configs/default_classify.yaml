defaults:
  - _self_
  - hydra: default
  - logger: mlflow
  - /data/datasets@data.train: classification/train
  - /data/datasets@data.val: classification/val
  - /data/datasets@data.test: classification/test
  - /data/datasets@data.predict: classification/predict
  - /model@model.model: ???

seed: ${random_seed:}
mode: [fit, test]

checkpoint:
  test: best

trainer:
  max_epochs: 100
  log_every_n_steps: 20
  enable_checkpointing: true
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      save_top_k: 1
      save_last: true
      auto_insert_metric_name: true
      monitor: validation/loss
      mode: min
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: validation/loss
      mode: min
      patience: 15
    finetuning:
      _target_: lightning.pytorch.callbacks.BackboneFinetuning
      unfreeze_backbone_at_epoch: 10

metadata:
  experiment_name: Lymph Nodes
  run_name: "🏋️‍♂️ ${model_name: ${model.model._target_}}"
  description: "Running ${model_name: ${model.model._target_}} on the Lymph Nodes DAB dataset."

data:
  _target_: lymph_nodes.data.DataModule
  batch_size: 64 # auto adjusted
  epoch_size: 1000
  num_workers: 10
  batch_distribution: [0.4, 0.2, 0.4]

model:
  _target_: lymph_nodes.ClassificationModel
  warmup_epochs: 2

tuner: {}
# dynamic_batch_size: True
