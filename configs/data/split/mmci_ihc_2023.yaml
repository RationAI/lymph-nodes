# @package _global_

dataset:
  institute: mmci
  name: SNB IHC

slides_uri: mlflow-artifacts:/4/30974f87ffbb448c99dd5db1d0e0fdec/artifacts/slides.csv
patients_uri: mlflow-artifacts:/4/30974f87ffbb448c99dd5db1d0e0fdec/artifacts/patients.csv

splits:
  train:
    fraction: 0.7
    n_folds: 5
    exclude_cases_where:
      - has_positive_slides
    exclude_slides_where:
      - has_tma_control
      - has_confounding_structures
  val:
    fraction: 0.15
    exclude_slides_where:
      - has_confounding_structures
  test:
    fraction: 0.15
