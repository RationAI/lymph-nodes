# @package _global_

dataset:
  institute: mmci
  name: IHC 2023

slides_uri: mlflow-artifacts:/4/12ddff6f3fc04e7984852d1626f864b4/artifacts/slides.csv
patients_uri: mlflow-artifacts:/4/12ddff6f3fc04e7984852d1626f864b4/artifacts/patients.csv

splits:
  train:
    fraction: 0.7
    n_folds: 5
    exclude_cases_where:
      - has_positive_slides
    exclude_slides_where:
      - has_tma_control
      - has_confounding_structures
      - little_tissue
  val:
    fraction: 0.15
    exclude_slides_where:
      - has_confounding_structures
  # Since 2026-11-25 cases 12, 22, 31, 35, 51 and 73 (12 negative slides) are left out of the
  # test set where it is loaded (configs/lymph_nodes.yaml, filters.no_control_donor_cases):
  # their control TMAs are training donors. The split run (095b1692) is unchanged.
  test:
    fraction: 0.15
