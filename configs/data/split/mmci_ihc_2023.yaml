# @package _global_

dataset:
  institute: mmci
  name: IHC 2023

slides_uri: mlflow-artifacts:/4/12ddff6f3fc04e7984852d1626f864b4/artifacts/slides.csv
patients_uri: mlflow-artifacts:/4/12ddff6f3fc04e7984852d1626f864b4/artifacts/patients.csv

splits:
  train:
    fraction: 0.7
    n_folds: 5
    exclude_cases_where:
      - has_positive_slides
    exclude_slides_where:
      - has_tma_control
      - has_confounding_structures
  val:
    fraction: 0.15
    exclude_slides_where:
      - has_confounding_structures
  test:
    fraction: 0.15
