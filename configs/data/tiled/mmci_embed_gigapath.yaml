# @package _global_

ihc_run_uri: mlflow-artifacts:/4/b158893b92d248118bd11a752bbdd108/artifacts
tma_run_uri: mlflow-artifacts:/4/aa131866e3364b21b9915eff7265def6/artifacts
ihc_test_run_uri: mlflow-artifacts:/4/9495d904b52e4d4cbf7d269d46d4af7d/artifacts

# Runs split into fold_0..fold_4, all taking part in cross-validation.
fold_run_uris: ["${ihc_run_uri}", "${tma_run_uri}"]
fold: ???

data:
  train:
    _target_: lymph_nodes.data.datasets.embedding.EmbeddingClassificationDataset
    uris: ${other_fold_uris:${fold_run_uris},5,${fold}}
    tile_filters: ${tile_filters.train}

  val:
    _target_: lymph_nodes.data.datasets.embedding.EmbeddingClassificationDataset
    uris:
      - ${ihc_run_uri}/fold_${fold}
      - ${tma_run_uri}/fold_${fold}
    tile_filters: ${tile_filters.test}

  eval:
    _target_: lymph_nodes.data.datasets.embedding.EmbeddingClassificationDataset
    uris:
      - ${ihc_run_uri}/val
      - ${tma_run_uri}/val
      - ${ihc_test_run_uri}/val
    tile_filters: ${tile_filters.test}

  test:
    _target_: lymph_nodes.data.datasets.embedding.EmbeddingClassificationDataset
    uris:
      - ${ihc_run_uri}/test
    tile_filters: ${tile_filters.test}
