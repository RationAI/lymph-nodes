# @package _global_

# The TMAs tiled by core split (preprocessing/tma_split.py): each split's slides table
# lists the slides with cores in it and which (``cores``). Use with
# experiment=tiling/mmci_tma_cores_segmentation, which keeps those cores' tiles.
dataset_name: TMA cores
# The core split run's artifacts (preprocessing/tma_split.py): run b535b4fe (2026-11-03).
slides_run_uri: mlflow-artifacts:/4/b535b4fe0e1d4531962530f46188edc1/artifacts
datasets:
  - name: fold_0
    slides:
      _target_: preprocessing.data_source.MLFlowDataSource
      uri: ${slides_run_uri}/train_fold_0/slides.csv
  - name: fold_1
    slides:
      _target_: preprocessing.data_source.MLFlowDataSource
      uri: ${slides_run_uri}/train_fold_1/slides.csv
  - name: fold_2
    slides:
      _target_: preprocessing.data_source.MLFlowDataSource
      uri: ${slides_run_uri}/train_fold_2/slides.csv
  - name: fold_3
    slides:
      _target_: preprocessing.data_source.MLFlowDataSource
      uri: ${slides_run_uri}/train_fold_3/slides.csv
  - name: fold_4
    slides:
      _target_: preprocessing.data_source.MLFlowDataSource
      uri: ${slides_run_uri}/train_fold_4/slides.csv
  - name: val
    slides:
      _target_: preprocessing.data_source.MLFlowDataSource
      uri: ${slides_run_uri}/val/slides.csv
