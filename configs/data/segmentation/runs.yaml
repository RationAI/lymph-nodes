# @package _global_

# Segmentation tiling runs (configs/experiment/tiling/*_segmentation.yaml), 16 x 16
# grids (the 14 px patch tokens; the upsampled scenarios set grid-32 runs), coverage
# grids, no embeddings — the same for every foundation model. The re-tiling of
# 2026-11-04: lymph node folds at stride 224, their val and test splits at 112, refined
# labels without margin (run 28e00226), node coverage; the TMAs by core split with the
# corrected ground truth, every split at 112. Before: 055b629c, cc1ccb76, 4fe79442.
ihc_run_uri: mlflow-artifacts:/4/56d3f373b4dd4424a28c46e665b3deaa/artifacts  # IHC 2023: fold_0..fold_4, val, test
tma_run_uri: mlflow-artifacts:/4/01c46ad7e5f3446a847aefd3d3cf32d5/artifacts  # TMA cores: fold_0..fold_4, val
ihc_test_run_uri: mlflow-artifacts:/4/2d481d2590474129a76aa9ad777dc4f4/artifacts  # IHC test cohort: val
fnb_run_uri: mlflow-artifacts:/4/868b61c28be840b5a2fb3fb99377a5b4/artifacts  # FN Brno AE: fold_0..fold_4 (negative), val, test

tiling: segmentation

# These tilings carry the refined labels: the evaluation uses them, with the outline
# labels reported next to them (configs/lymph_nodes.yaml, label_set), and sizes lesions
# by their stained area (lymph_nodes/callbacks/lesion_metrics.py).
label_set: refined
data:
  eval:
    outline_labels: ${eval_label_sets.outline}
  test:
    outline_labels: ${ln_label_sets.outline}
trainer:
  callbacks:
    lesion_metrics:
      lesion_size_column: annotation_brown_coverage
      cell_area_um2: 150.0
