[project]
name = "lymph-nodes"
version = "0.1.0"
description = ""
authors = []
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26.2",
    "nptyping>=2.5.0",
    "polars>=0.20.2",
    "pandas>=2.1.4",
    "scikit-learn>=1.3.2",
    "scipy>=1.11.4",
    "pyvips>=2.2.1",
    "torch>=2.1.2",
    "torchvision>=0.16.2",
    "torchmetrics>=1.2.1",
    "Pillow>=10.1.0",
    "tqdm>=4.66.1",
    "pytest>=7.4.3",
    "albumentations>=1.3.1",
    "lightning>=2.1.3",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.2",
    "mlflow>=2.9.2",
    "captum>=0.7.0",
    "humanize>=4.9.0",
    "SlideLip @ git+ssh://git@gitlab.ics.muni.cz/rationai/digital-pathology/pipeline/slidelip",
]

[tool.pdm.dev-dependencies]
dev = ["mypy", "pre-commit", "ruff"]


[tool.pdm.scripts]
preprocessing = "python -m preprocessing.run +experiments={args}"
metrics = "python -m metrics.run +experiments={args}"
train = "python -m pipeline.fit +experiments={args}"
eval = "python -m pipeline.test +experiments={args}"

l = { composite = ["lint", "format", "mypy"] }
lint = "ruff check ."
format = "ruff format ."
mypy = "mypy ."
post_install = { composite = [
    "pre-commit install",
    "pre-commit install --hook-type commit-msg",
] }

[tool.pdm]
distribution = false

[tool.setuptools]
py-modules = []
