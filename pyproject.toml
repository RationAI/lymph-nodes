[project]
name = "lymph-nodes"
version = "0.1.0"
authors = [
    { name = "Jakub Pekár", email = "jakubpekar@mail.muni.cz" },
]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "lightning>=2.0.0",
    "albumentations>=1.4.14",
    "torchvision>=0.17.2",
    "pandas>=2.2.2",
    "torch>=2.2.2",
    "tqdm>=4.66.5",
    "numpy<2.0",
    "rationai-tiling @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/tiling.git",
    "rationai-mlkit @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git@feature/batch-sampler-new",
    "rationai-masks @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/masks.git@feature/modular-tissue-mask",
    "rationai-kube-jobs @ git+ssh://git@gitlab.ics.muni.cz/rationai/digital-pathology/libraries/kube-jobs.git",
    "timm>=1.0.15",
    "mamba-ssm>=2.2.4",
    "einops>=0.8.1",
    "dynamic-network-architectures>=0.3.1",
    "report @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/tools/report.git@feature/mirax-support",
]

[tool.pdm.dev-dependencies]
dev = ["mypy", "pre-commit", "ruff"]

[tool.pdm.scripts]
train-seg = "python -m lymph_nodes --config-name=default_segment"
train-cls = "python -m lymph_nodes --config-name=default_classify"
preprocess = "python -m prepro"
job = "python job.py"
l = { composite = ["lint", "format", "mypy"] }
lint = "ruff check --fix"
format = "ruff format"
mypy = "mypy ."
post_install = { composite = [
    "pre-commit autoupdate",
    "pre-commit install",
    "pre-commit install --hook-type commit-msg",
] }

[tool.pdm]
distribution = false

[tool.ruff]
exclude = ["cytokeratin_mask"]
