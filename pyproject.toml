[project]
name = "lymph-nodes"
version = "0.1.0"
authors = [
    { name = "Jakub Pekár", email = "jakubpekar@mail.muni.cz" },
]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "lightning>=2.0.0",
    "albumentations>=1.4.14",
    "torchvision>=0.17.2",
    "pandas>=2.2.2",
    "torch>=2.2.2,<2.3",
    "tqdm>=4.66.5",
    "numpy<2.0",
    "rationai-tiling @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/tiling.git",
    "rationai-masks @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/masks.git",
    "rationai-mlkit @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git@feature/batch-sampler-new",
]

[tool.pdm.dev-dependencies]
dev = ["mypy", "pre-commit", "ruff"]

[tool.pdm.scripts]
preprocess = "python -m prepro"
fit = "python -m lymph_nodes mode=fit"
validate = "python -m lymph_nodes mode=validate"
test = "python -m lymph_nodes mode=test"
predict = "python -m lymph_nodes mode=predict"
l = { composite = ["lint", "format", "mypy"] }
lint = "ruff check --fix"
format = "ruff format"
mypy = "mypy ."
post_install = { composite = [
    "pre-commit autoupdate",
    "pre-commit install",
    "pre-commit install --hook-type commit-msg",
] }

[tool.pdm]
distribution = false

[tool.ruff]
exclude = ["cytokeratin_mask"]
