[project]
name = "lymph-nodes"
version = "0.1.0"
authors = [
    { name = "Jakub Pekár", email = "jakubpekar@mail.muni.cz" },
    { name = "Tomáš Homola", email = "567740@mail.muni.cz" },
]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "aiohttp>=3.13.2",
    "numpy>=2.3.5",
    "lightning>=2.5.6",
    "omegaconf>=2.3.0",
    "torch>=2.9.0",
    "torchmetrics>=1.8.2",
    "rationai-sdk",
    "ratiopath>=1.4.1",
    "timm>=1.0.0",
    "mlflow>=2.22.4",
    "ray[default]>=2.53.0",
    "rationai-mlkit",
    "kubernetes==35.0.0",
]

[dependency-groups]
dev = ["mypy", "ruff"]
run = [
    "rationai-kube-jobs",
]

[tool.uv.sources]
rationai-sdk = { git = "https://gitlab.ics.muni.cz/rationai/infrastructure/rationai-sdk-python.git" }
rationai-mlkit = { git = "https://github.com/RationAI/mlkit.git", rev = "feature/mlflow-dataset" }
rationai-kube-jobs = { git = "ssh://gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs" }


